<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A short calm breathing session when you need to settle down." />
  <title>Lock in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="home" id="homeScreen">
    <div class="home__glow" aria-hidden="true"></div>
    <div class="home__content">
      <p class="home__eyebrow">Settle first</p>
      <h1 class="home__title">Lock in</h1>
      <p class="home__tagline">A short breathing session to calm your body, then return to what matters.</p>

      <fieldset class="duration">
        <legend class="duration__label">How long</legend>
        <div class="duration__options" role="radiogroup" aria-label="Session length">
          <label class="chip">
            <input type="radio" name="duration" value="60" />
            <span>1 min</span>
          </label>
          <label class="chip">
            <input type="radio" name="duration" value="120" checked />
            <span>2 min</span>
          </label>
          <label class="chip">
            <input type="radio" name="duration" value="300" />
            <span>5 min</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="pattern">
        <legend class="pattern__label">Breathing pattern</legend>
        <div class="pattern__options" role="radiogroup" aria-label="Breathing pattern">
          <label class="chip">
            <input type="radio" name="pattern" value="box" checked />
            <span>Box (4-4-4-4)</span>
          </label>
          <label class="chip">
            <input type="radio" name="pattern" value="calm" />
            <span>Calm (4-7-8)</span>
          </label>
          <label class="chip">
            <input type="radio" name="pattern" value="simple" />
            <span>Simple (4-4)</span>
          </label>
        </div>
      </fieldset>

      <label class="toggle">
        <input type="checkbox" id="soundToggle" checked />
        <span>Soft ambient sound</span>
      </label>

      <button type="button" class="btn btn-primary" id="startBtn">Begin</button>
    </div>
  </main>

  <section class="session" id="sessionScreen" aria-hidden="true">
    <div class="session__bg" aria-hidden="true"></div>
    <button type="button" class="btn btn-ghost session__skip" id="skipBtn">End early</button>
    <div class="session__circle" id="breathCircle" aria-hidden="true"></div>
    <p class="session__phase" id="phaseText">Get ready</p>
    <p class="session__hint" id="phaseHint">Find a comfortable seat. Soften your shoulders.</p>
    <p class="session__timer" id="sessionTimer" aria-live="polite">2:00</p>
  </section>

  <section class="done" id="doneScreen" aria-hidden="true">
    <div class="done__bg" aria-hidden="true"></div>
    <p class="done__title">You are steadier now.</p>
    <p class="done__sub">Carry that calm into the next thing.</p>
    <button type="button" class="btn btn-primary" id="againBtn">Do another</button>
    <button type="button" class="btn btn-ghost" id="homeBtn">Back home</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
